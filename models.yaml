# nano Model Catalog
# Synced to nano instances via Settings > AI Configuration > Sync Upstream
#
# Format:
#   model_id: provider/model-name (e.g. anthropic/claude-sonnet-5)
#   display_name: Human-readable name shown in the UI
#   context_window: Max context window in tokens (optional)
#   tier: Cost/access class — economy | standard | full (optional).
#         Drives AI credit billing (economy = lite, 2 credits; standard/full =
#         10) and plan gating. Omit only for models whose cost is unknown.

models:
  # Anthropic (Direct API)
  - model_id: anthropic/claude-opus-5
    display_name: Claude Opus 5
    context_window: 1000000
    supports_temperature: false
    tier: full

  - model_id: anthropic/claude-sonnet-5
    display_name: Claude Sonnet 5
    context_window: 1000000
    supports_temperature: false
    tier: standard

  - model_id: anthropic/claude-haiku-4-5
    display_name: Claude Haiku 4.5
    context_window: 200000
    tier: economy

  # Anthropic (AWS Bedrock)
  - model_id: bedrock/anthropic.claude-opus-5
    display_name: Claude Opus 5 (Bedrock)
    context_window: 1000000
    supports_temperature: false
    tier: full

  - model_id: bedrock/anthropic.claude-sonnet-5
    display_name: Claude Sonnet 5 (Bedrock)
    context_window: 1000000
    supports_temperature: false
    tier: standard

  - model_id: bedrock/anthropic.claude-haiku-4-5-20251001-v1:0
    display_name: Claude Haiku 4.5 (Bedrock)
    context_window: 200000
    tier: economy

  # Google Gemini
  - model_id: gemini/gemini-3.1-pro-preview
    display_name: Gemini 3.1 Pro Preview
    context_window: 1048576
    tier: standard

  - model_id: gemini/gemini-3.5-flash-lite
    display_name: Gemini 3.5 Flash Lite
    context_window: 1048576
    tier: economy

  - model_id: gemini/gemini-3.6-flash
    display_name: Gemini 3.6 Flash
    context_window: 1048576
    tier: economy

  # OpenAI
  # All three GPT-5.6 tiers share the same 1,050,000 context window and 128K max
  # output (per developers.openai.com); they differ on price and latency, not size.
  - model_id: openai/gpt-5.6-sol
    display_name: GPT-5.6 Sol
    context_window: 1050000
    supports_temperature: false
    tier: full

  - model_id: openai/gpt-5.6-terra
    display_name: GPT-5.6 Terra
    context_window: 1050000
    supports_temperature: false
    tier: standard

  - model_id: openai/gpt-5.6-luna
    display_name: GPT-5.6 Luna
    context_window: 1050000
    supports_temperature: false
    tier: economy

  # Cloudflare Workers AI
  - model_id: workers-ai/@cf/zai-org/glm-5.2
    display_name: GLM-5.2 (Cloudflare)
    context_window: 200000
    tier: economy
